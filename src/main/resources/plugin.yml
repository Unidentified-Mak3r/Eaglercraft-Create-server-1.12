name: HunterCompass
main: com.eaglercraft.huntercompass.HunterCompassPlugin
version: ${project.version}
author: OpenAI
load: POSTWORLD
description: Bind compasses to players and track them on Eaglercraft-compatible legacy Bukkit servers.
commands:
  unbindcompass:
    description: Removes the HunterCompass target from the compass in your hand.
    usage: /unbindcompass
    permission: huntercompass.unbind
permissions:
  huntercompass.use:
    description: Allows binding and using hunter compasses.
    default: true
  huntercompass.unbind:
    description: Allows unbinding hunter compasses.
    default: true
